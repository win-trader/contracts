name: publish

# Publishes the public TS packages to npm (public).
# Trigger: push a tag like `v0.1.0`, or run manually. Versions come from each
# package.json (bump by hand, then tag). Packages already at their published
# version are skipped, so re-running is safe.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # npm trusted publishing (OIDC): each package lists this repo and
  # publish.yml as its trusted publisher on npmjs.com, so no token is stored.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - name: Publish to npm
        run: |
          for d in packages/config packages/protocol-math packages/protocol-clients packages/bindings; do
            echo "::group::publish $d"
            id="$(node -p "const p=require('./$d/package.json'); p.name+'@'+p.version")"
            if npm view "$id" version >/dev/null 2>&1; then
              echo "$id is already on npm"
            else
              (cd "$d" && npm publish --access public)
            fi
            echo "::endgroup::"
          done
