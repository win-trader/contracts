name: contracts

# Tests the contracts, then builds and optimizes the WASM exactly as
# `make optimize` does, which fails if any contract exceeds the network's
# 131,072-byte size limit.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: stellar CLI (pinned to the Makefile's STELLAR_CLI_VERSION; bundles the optimizer)
        run: |
          v=$(sed -n 's/^STELLAR_CLI_VERSION = //p' Makefile)
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${v}/stellar-cli-${v}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo test --workspace
      - run: make optimize
